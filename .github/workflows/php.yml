name: PHP 8.5

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      SIMPLE_EVENT_TEST_REDIS_HOST: 127.0.0.1
      SIMPLE_EVENT_TEST_REDIS_PORT: 6379
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 PHP 与 Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: redis
          coverage: none
          tools: composer:v2

      - name: 安装依赖
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: 校验 Composer 配置
        run: composer validate --strict --no-interaction

      - name: 运行回归测试
        run: composer test --no-interaction
